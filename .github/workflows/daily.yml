name: Daily pipeline

on:
  schedule:
    # 02:30 UTC every day; the date drives the category rotation.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Topic category to run (auto = today's rotation)"
        type: choice
        options:
          - auto
          - ai_tech
          - finance
          - health_fitness
          - general_knowledge
        default: auto
      dry_run:
        description: "Run the pipeline in dry-run mode (no external calls)"
        type: boolean
        default: true

# Never let two daily runs overlap; keep the current one running instead.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_SECRET_EN: ${{ secrets.YOUTUBE_CLIENT_SECRET_EN }}
      YOUTUBE_CLIENT_SECRET_HI: ${{ secrets.YOUTUBE_CLIENT_SECRET_HI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install system tools (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Resolve category
        id: category
        env:
          INPUT_CATEGORY: ${{ github.event.inputs.category || 'auto' }}
        run: |
          if [ -z "$INPUT_CATEGORY" ] || [ "$INPUT_CATEGORY" = "auto" ]; then
            CATEGORY="$(python -m src.pipeline.schedule)"
          else
            CATEGORY="$INPUT_CATEGORY"
          fi
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "Resolved category: $CATEGORY"

      - name: Run pipeline
        env:
          CATEGORY: ${{ steps.category.outputs.category }}
          # Non-empty (=> --dry-run) unless a manual dispatch explicitly asks
          # for a live run (dry_run=false). Scheduled runs default to dry-run.
          DRY_RUN: ${{ (github.event.inputs.dry_run == 'false') && '' || 'true' }}
        run: python -m src.pipeline --category "$CATEGORY" ${DRY_RUN:+--dry-run}

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/**
          if-no-files-found: ignore
